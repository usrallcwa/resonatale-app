<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ResonaTale</title>
<meta name="theme-color" content="#07070B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07070B;--sf:#111118;--pn:#181824;
  --blue:#00E5FF;--pink:#FF2ED1;--green:#00FF94;--lime:#C6FF00;--warn:#FF5252;
  --t1:#FFF;--t2:#9999AA;--t3:#55556A;
  --grad:linear-gradient(90deg,#00E5FF,#FF2ED1,#C6FF00);
  --glow:0 0 30px rgba(0,229,255,.4);
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--t1);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;background:rgba(7,7,11,.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.04)}
.logo{font-size:18px;font-weight:800;letter-spacing:-.5px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;cursor:pointer}
.nav-r{display:flex;gap:10px;align-items:center}
.nav-credits{font-size:12px;font-weight:500;color:var(--t2);padding:7px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.08);background:rgba(24,24,36,.8);cursor:pointer;transition:all .2s}
.nav-credits:hover{color:var(--t1);border-color:rgba(255,255,255,.18);background:rgba(24,24,36,1)}
.nav-contact{font-size:12px;font-weight:500;color:var(--t2);padding:7px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.08);background:rgba(24,24,36,.8);cursor:pointer;transition:all .2s}
.nav-contact:hover{color:var(--t1);border-color:rgba(255,255,255,.18);background:rgba(24,24,36,1)}

/* LAYOUT */
.wrap{max-width:460px;margin:0 auto;padding:80px 20px 40px}

/* HOME */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:60px;gap:18px}
.orb{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--blue),var(--pink),var(--lime));filter:blur(1px);animation:orbSpin 7s linear infinite}
@keyframes orbSpin{
  0%{transform:rotate(0deg) scale(1);box-shadow:0 0 40px rgba(0,229,255,.35)}
  50%{transform:rotate(180deg) scale(1.08);box-shadow:0 0 90px rgba(255,46,209,.35)}
  100%{transform:rotate(360deg) scale(1);box-shadow:0 0 40px rgba(0,229,255,.35)}
}
.hero h1{font-size:34px;font-weight:900;letter-spacing:-1.5px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{font-size:15px;color:var(--t2);max-width:280px;line-height:1.5}

/* BUTTONS */
.btn{background:var(--grad);border:none;border-radius:14px;padding:15px 28px;font-family:inherit;font-size:15px;font-weight:700;color:var(--bg);box-shadow:var(--glow);cursor:pointer;transition:transform .2s;width:100%;max-width:300px;letter-spacing:-.3px}
.btn:hover{transform:scale(1.03)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-s{background:var(--pn);border:1px solid rgba(0,229,255,.2);color:var(--blue);box-shadow:none;border-radius:14px;padding:12px 20px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;width:100%;max-width:300px}
.btn-s:hover{border-color:rgba(0,229,255,.5);background:rgba(0,229,255,.06)}

/* FORM */
.section{margin-bottom:22px}
.label{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;display:block}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:7px 14px;border-radius:999px;background:var(--pn);border:1px solid rgba(255,255,255,.06);font-family:inherit;font-size:12px;font-weight:500;color:var(--t2);cursor:pointer;transition:all .2s}
.chip:hover{border-color:rgba(255,255,255,.15);color:var(--t1)}
.chip.on{color:var(--bg);font-weight:600;border-color:transparent}
.chip[data-v="calm"].on{background:var(--blue);box-shadow:0 0 14px rgba(0,229,255,.3)}
.chip[data-v="cozy"].on{background:#FF9F43;box-shadow:0 0 14px rgba(255,159,67,.3)}
.chip[data-v="adventure"].on{background:var(--green);box-shadow:0 0 14px rgba(0,255,148,.3)}
.chip[data-v="romantic"].on{background:var(--pink);box-shadow:0 0 14px rgba(255,46,209,.3)}
.chip[data-v="suspense"].on{background:var(--warn);box-shadow:0 0 14px rgba(255,82,82,.3)}
.chip[data-v="motivational"].on{background:var(--lime);box-shadow:0 0 14px rgba(198,255,0,.3)}
.chip[data-v="heartwarming"].on{background:#FF6B9D;box-shadow:0 0 14px rgba(255,107,157,.3)}

/* SELECT */
.sel{width:100%;background:var(--pn);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:11px 14px;font-family:inherit;font-size:13px;color:var(--t1);outline:none;appearance:none;cursor:pointer;transition:border-color .2s}
.sel:focus{border-color:rgba(0,229,255,.4)}
.sel option{background:var(--pn);color:var(--t1)}

/* TEXTAREA */
.ta{width:100%;min-height:80px;max-height:160px;background:var(--pn);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:12px 14px;font-family:inherit;font-size:13px;color:var(--t1);resize:vertical;outline:none;transition:border-color .2s;line-height:1.5}
.ta::placeholder{color:var(--t3)}
.ta:focus{border-color:rgba(0,229,255,.4);box-shadow:0 0 16px rgba(0,229,255,.08)}
.hint{font-size:11px;color:var(--t3);margin-top:5px}

/* DURATION TOGGLE */
.dur-row{display:flex;gap:6px;background:var(--pn);border-radius:999px;padding:3px;border:1px solid rgba(255,255,255,.06)}
.dur-opt{flex:1;padding:9px;border-radius:999px;font-family:inherit;font-size:12px;font-weight:600;color:var(--t3);background:none;border:none;cursor:pointer;transition:all .2s;text-align:center}
.dur-opt.on{background:rgba(0,229,255,.15);color:var(--blue)}

/* TURNSTILE */
.ts-box{display:flex;justify-content:center;margin:18px 0;min-height:65px}

/* LOADING */
.loader{position:fixed;inset:0;z-index:200;background:rgba(7,7,11,.92);backdrop-filter:blur(12px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.loader.show{display:flex}
.spin{width:52px;height:52px;border-radius:50%;border:3px solid rgba(255,255,255,.06);border-top-color:var(--blue);border-right-color:var(--pink);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loader p{font-size:14px;color:var(--t2)}

/* RESULTS */
.results{display:none}
.results.show{display:block}
.scene-card{background:var(--sf);border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:20px;margin-bottom:12px;transition:border-color .2s}
.scene-card:hover{border-color:rgba(0,229,255,.15)}
.scene-num{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--blue);margin-bottom:8px}
.scene-title{font-size:16px;font-weight:700;letter-spacing:-.3px;margin-bottom:10px}
.scene-block{margin-bottom:10px}
.scene-block:last-child{margin-bottom:0}
.scene-block-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:4px}
.scene-block-text{font-size:13px;color:var(--t2);line-height:1.6}
.voiceover-text{color:var(--t1);font-style:italic}

/* TOAST */
.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:400;background:var(--sf);border:1px solid rgba(255,82,82,.3);border-radius:10px;padding:10px 18px;font-size:12px;font-weight:500;color:var(--warn);box-shadow:0 8px 30px rgba(0,0,0,.5);animation:ti .3s ease;display:none;white-space:nowrap}
.toast.ok{border-color:rgba(0,255,148,.3);color:var(--green)}
.toast.show{display:block}
@keyframes ti{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* FOOTER */
.foot{display:flex;align-items:center;justify-content:center;gap:14px;padding:28px 0 16px;flex-wrap:wrap}
.foot a{font-size:11px;color:var(--t3);transition:color .2s}
.foot a:hover{color:var(--t2)}
.foot-dot{width:3px;height:3px;border-radius:50%;background:var(--t3);opacity:.4}

/* SCREEN TRANSITION */
.screen{animation:si .3s ease}
@keyframes si{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.hide{display:none!important}
</style>
</head>
<body>

<nav class="nav">
  <div class="logo" id="logo">RESONATALE</div>
  <div class="nav-r">
    <button class="nav-credits" type="button">Add credits</button>
  </div>
</nav>

<div id="toast" class="toast"></div>
<div id="loader" class="loader"><div class="spin"></div><p id="loader-msg">Generating scenes...</p></div>

<div class="wrap">

  <!-- HOME -->
  <div id="s-home" class="screen">
    <div class="hero">
      <div class="orb"></div>
      <h1>RESONATALE</h1>
      <p>Cinematic AI storyboards designed for premium short films.</p>
      <button class="btn" id="go-create">Create Story</button>
    </div>
    <div class="foot">
      <a href="privacy.html">Privacy</a><span class="foot-dot"></span>
      <a href="terms.html">Terms</a><span class="foot-dot"></span>
      <a href="mailto:admin@resonatale.com">Contact</a>
    </div>
  </div>

  <!-- CREATE -->
  <div id="s-create" class="screen hide">
    <div style="margin-bottom:24px">
      <h2 style="font-size:22px;font-weight:800;letter-spacing:-.6px;margin-bottom:4px">Create Story</h2>
      <p style="font-size:13px;color:var(--t2)">Set the mood. Describe the vision. Let AI craft the scenes.</p>
    </div>

    <div class="section">
      <label class="label">Mood</label>
      <div class="chips" id="mood-chips"></div>
    </div>

    <div class="section">
      <label class="label">Language</label>
      <select class="sel" id="lang-sel">
        <option value="en">&#127482;&#127480; English</option>
        <option value="es">&#127466;&#127480; Spanish</option>
        <option value="fr">&#127467;&#127479; French</option>
        <option value="ja">&#127471;&#127477; Japanese</option>
        <option value="de">&#127465;&#127466; German</option>
        <option value="it">&#127470;&#127481; Italian</option>
        <option value="pt">&#127477;&#127481; Portuguese</option>
        <option value="ko">&#127472;&#127479; Korean</option>
      </select>
    </div>

    <div class="section">
      <label class="label">Brief</label>
      <textarea class="ta" id="brief" placeholder="A lone astronaut finds a glowing garden on Mars..."></textarea>
      <p class="hint">Describe your story concept. Be vivid.</p>
    </div>

    <div class="section">
      <label class="label">Duration</label>
      <div class="dur-row" id="dur-row"></div>
    </div>

    <div class="ts-box"><div id="ts-target"></div></div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
      <button class="btn" id="gen-btn">Generate Scenes</button>
      <p class="hint" style="text-align:center">Powered by OpenAI</p>
    </div>
    <!-- RESULTS -->
    <div id="results" class="results" style="margin-top:28px">
      <div style="margin-bottom:16px;display:flex;align-items:center;justify-content:space-between">
        <h3 style="font-size:18px;font-weight:700;letter-spacing:-.4px">Your Scenes</h3>
        <button class="btn-s" id="new-btn" style="width:auto;max-width:none;padding:8px 16px;font-size:12px">New Story</button>
      </div>
      <div id="scenes-list"></div>
    </div>

    <div class="foot" style="margin-top:24px">
      <a href="privacy.html">Privacy</a><span class="foot-dot"></span>
      <a href="terms.html">Terms</a><span class="foot-dot"></span>
      <a href="mailto:admin@resonatale.com">Contact</a>
    </div>
  </div>

</div>

<script src="js/ui.js"></script>
<script src="js/app.js"></script>

</body>
</html>
