<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ResonaTale – You Are The Star</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-icon-180x180.png" />

  <link rel="stylesheet" href="css/styles.css" />

  <!-- Turnstile config + callbacks -->
  <script>
    window.TURNSTILE_SITE_KEY = "0x4AAAAAACLI9vyJZYGLg9lS";
    window.turnstileToken = null;

    window.onTurnstileSuccess = function (token) {
      window.turnstileToken = token;
    };

    window.onTurnstileExpired = function () {
      window.turnstileToken = null;
    };

    window.onTurnstileError = function () {
      window.turnstileToken = null;
    };
  </script>

  <!-- Cloudflare Turnstile -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>

<body>
  <div class="app-root">
    <!-- HEADER -->
    <header class="app-header">
      <div class="header-left">
        <a href="/" class="brand-logo" aria-label="ResonaTale home">
          <!-- Inline SVG logo -->
          <svg
            viewBox="0 0 320 320"
            xmlns="http://www.w3.org/2000/svg"
            class="brand-logo-img"
            role="img"
            aria-label="ResonaTale logo"
          >
            <rect width="320" height="320" rx="40" fill="#F3F6FB" />
            <rect x="40" y="40" width="240" height="240" rx="40" fill="white" />

            <circle cx="160" cy="160" r="95" fill="none" stroke="#E7ECF5" stroke-width="26" />

            <path
              d="M 80 160 A 80 80 0 0 1 215 105"
              fill="none"
              stroke="#1E7BFF"
              stroke-width="40"
              stroke-linecap="round"
            />
            <path
              d="M 110 235 A 90 90 0 0 0 240 150"
              fill="none"
              stroke="#00B978"
              stroke-width="40"
              stroke-linecap="round"
            />

            <circle cx="160" cy="160" r="38" fill="white" />
            <circle cx="160" cy="160" r="8" fill="none" stroke="#4E6CFB" stroke-width="2" />

            <line x1="160" y1="118" x2="160" y2="95"  stroke="#D1D9EB" stroke-width="2" />
            <line x1="160" y1="202" x2="160" y2="225" stroke="#D1D9EB" stroke-width="2" />
            <line x1="118" y1="160" x2="95"  y2="160" stroke="#D1D9EB" stroke-width="2" />
            <line x1="202" y1="160" x2="225" y2="160" stroke="#D1D9EB" stroke-width="2" />

            <circle cx="160" cy="52"  r="14" fill="#00B978" />
            <circle cx="268" cy="160" r="14" fill="#00B978" />
            <circle cx="160" cy="268" r="14" fill="#1E7BFF" />
            <circle cx="52"  cy="160" r="14" fill="#1E7BFF" />

            <line x1="160" y1="24"  x2="160" y2="52"  stroke="#FDFEFF" stroke-width="2" />
            <circle cx="160" cy="24"  r="3" fill="#FDFEFF" />

            <line x1="296" y1="160" x2="268" y2="160" stroke="#00B978" stroke-width="2" />
            <circle cx="296" cy="160" r="3" fill="#00B978" />

            <line x1="160" y1="296" x2="160" y2="268" stroke="#FDFEFF" stroke-width="2" />
            <circle cx="160" cy="296" r="3" fill="#FDFEFF" />

            <line x1="24"  y1="160" x2="52"  y2="160" stroke="#FDFEFF" stroke-width="2" />
            <circle cx="24"  cy="160" r="3" fill="#FDFEFF" />
          </svg>
        </a>
      </div>

      <div class="header-right">
        <button class="header-menu-btn" type="button" onclick="if (window.openMenu) window.openMenu();">
          ☰
        </button>
      </div>
    </header>

    <!-- HERO / WELCOME SCREEN -->
    <div id="heroScreen" class="screen active">
      <button class="link-btn hero-login-btn" type="button" onclick="if (window.showLogin) window.showLogin();">
        Login
      </button>

      <div class="hero">
        <h1 class="hero-logo">ResonaTale</h1>
        <p class="hero-tag">You Are The Star</p>

        <div class="hero-desc">
          <p>Turn your photos into epic AI films</p>
          <p class="hero-desc-sub">Narrated in your own voice</p>
        </div>

        <button class="btn primary-btn pulse" type="button" onclick="if (window.startApp) window.startApp();">
          Start Creating
        </button>

        <p class="hero-note">Free preview • No signup required</p>
      </div>

      <div class="hero-footer">
        <a
          class="link-btn"
          href="mailto:admin@resonatale.com?subject=ResonaTale%20Support"
        >
          Contact
        </a>
        <a class="link-btn" href="terms.index.html" target="_blank">Terms</a>
        <a class="link-btn" href="privacy.index.html" target="_blank">Privacy</a>
      </div>
    </div>

    <!-- UPLOAD SCREEN -->
    <div id="uploadScreen" class="screen">
      <div class="screen-header">
        <button class="back-btn" type="button" onclick="if (window.goBack) window.goBack('heroScreen');">←</button>
        <h2 class="screen-title">Upload Photos</h2>
        <span class="step">1/4</span>
      </div>
      <!-- existing upload UI goes here -->
    </div>

    <!-- SCRIPT SCREEN -->
    <div id="scriptScreen" class="screen">
      <div class="screen-header">
        <button class="back-btn" type="button" onclick="if (window.goBack) window.goBack('uploadScreen');">←</button>
        <h2 class="screen-title">Script</h2>
        <span class="step">2/4</span>
      </div>
      <!-- script UI -->
    </div>

    <!-- VOICE SCREEN -->
    <div id="voiceScreen" class="screen">
      <div class="screen-header">
        <button class="back-btn" type="button" onclick="if (window.goBack) window.goBack('scriptScreen');">←</button>
        <h2 class="screen-title">Voice</h2>
        <span class="step">3/4</span>
      </div>
      <!-- voice UI -->
    </div>

    <!-- PREVIEW SCREEN -->
    <div id="previewScreen" class="screen">
      <div class="screen-header">
        <button class="back-btn" type="button" onclick="if (window.goBack) window.goBack('voiceScreen');">←</button>
        <h2 class="screen-title">Preview &amp; Export</h2>
        <span class="step">4/4</span>
      </div>
      <!-- preview UI -->
    </div>

    <!-- LOGIN / AUTH MODAL -->
    <div id="authModal" class="auth-modal" style="display:none;">
      <div class="auth-card">
        <button class="auth-close" type="button" onclick="if (window.closeLogin) window.closeLogin();">×</button>
        <h2 class="auth-title">Login</h2>
        <!-- login form fields/buttons go here -->
      </div>
    </div>

    <!-- MENU OVERLAY (hidden by default) -->
    <div id="menuOverlay" class="menu-overlay" style="display:none;">
      <div class="menu-content">
        <button class="menu-close" type="button" onclick="if (window.closeMenu) window.closeMenu();">×</button>
        <div class="menu-user">
          <p class="menu-email" id="menuEmail">user@email.com</p>
          <p class="menu-balance">$<span id="menuBalance">0</span></p>
        </div>
        <div class="menu-items">
          <!-- type="button" so it never submits a form / reloads -->
          <button class="menu-item" type="button" onclick="if (window.showAddCredits) window.showAddCredits();">
            💳 Add Credits
          </button>
          <button class="menu-item danger" type="button" onclick="if (window.logout) window.logout();">
            🚪 Logout
          </button>
        </div>
      </div>
    </div>

    <!-- LOADING OVERLAY -->
    <div id="loadingOverlay" class="loading-overlay" style="display:none;">
      <div class="spinner"></div>
      <p class="loading-text" id="loadingText">Processing...</p>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/wallet.js"></script>
  <script src="js/render.js"></script>
</body>
</html>
